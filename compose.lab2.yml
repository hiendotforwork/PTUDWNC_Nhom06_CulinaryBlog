services:
  postgres-lab2:
    image: postgres:16
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: culinary_lab2
      POSTGRES_USER: culinary_lab2
      POSTGRES_PASSWORD: ${LAB2_POSTGRES_PASSWORD:?Set a local test password}
    volumes:
      - lab2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culinary_lab2 -d culinary_lab2"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lab2-pgdata:
