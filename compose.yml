name: culinary-blog

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinary_blog
      POSTGRES_USER: culinary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culinary_dev_password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culinary -d culinary_blog"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: src/CulinaryBlog.API/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Redis__Connection: redis:6379
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
      Email__From: noreply@culinary.local
      Site__BaseUrl: http://localhost:3000
      Site__PublicApiUrl: http://localhost:5058
      FileStorage__Provider: Local
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=culinary_blog;Username=culinary;Password=${POSTGRES_PASSWORD:-culinary_dev_password}
      Database__AutoMigrate: "true"
      Database__SeedLab2: "true"
      Jwt__Secret: ${JWT_SECRET:-CulinaryBlogDockerDevelopmentSecretKey2026AtLeast32Characters}
      Jwt__Issuer: CulinaryBlog
      Jwt__Audience: CulinaryBlogApp
    ports:
      - "5058:8080"
    volumes:
      - recipe-images:/app/wwwroot/uploads

volumes:
  postgres-data:
  recipe-images: